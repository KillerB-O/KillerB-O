name: Update GitHub Profile Analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile analytics
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: KillerB-O
          cards: overview,lifetime,contributions,composition,rhythm,languages
          output-dir: assets
          themes: light,dark
          font: Roboto
          mono-font: Roboto Mono
          commit: true
          commit-message: "chore(profile): refresh analytics [skip ci]"
